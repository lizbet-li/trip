<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0D1712">
<title>Поездка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0D1712;--glass:rgba(255,255,255,.055);--edge:rgba(255,255,255,.11);--edge-2:rgba(255,255,255,.06);
  --text:#E8F1E5;--text-2:#9DB3A2;--text-3:#6C8477;
  --sage:#A8C99A;--sage-deep:#7FA872;--lime:#C9E87A;--gold:#C9A961;
  --r:22px;--pad:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;padding:0 0 130px;color:var(--text);min-height:100vh;position:relative;overflow-x:hidden;
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;background:var(--bg);
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(120% 70% at 15% -5%, rgba(122,168,114,.30), transparent 62%),
    radial-gradient(95% 55% at 92% 12%, rgba(60,120,92,.26), transparent 60%),
    radial-gradient(130% 80% at 50% 108%, rgba(88,140,104,.20), transparent 65%),
    linear-gradient(180deg,#101C16,#0B140F 55%,#0D1712);
}
.wrap{max-width:520px;margin:0 auto;padding:0 var(--pad)}
.display{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.015em}
.glass{
  background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);
  backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 18px 40px rgba(0,0,0,.30);
}

/* плашка про встроенную копию */
.offline{
  margin-top:22px;padding:13px 16px;border-radius:14px;font-size:12.5px;line-height:1.5;
  color:#E4D6AE;background:rgba(201,169,97,.10);border:1px solid rgba(201,169,97,.28);
}

/* постер */
.poster{
  position:relative;margin-top:22px;border-radius:26px;overflow:hidden;
  aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--edge);box-shadow:0 24px 60px rgba(0,0,0,.45);
}
@supports not (aspect-ratio:1){ .poster{height:min(78vw*1.25,560px)} }
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.poster .veil{
  position:absolute;inset:0;
  background:
    radial-gradient(66% 44% at 50% 50%, rgba(9,17,13,.60), rgba(9,17,13,.10) 78%, transparent 100%),
    linear-gradient(180deg,rgba(9,17,13,.30) 0%,rgba(9,17,13,0) 30%,rgba(9,17,13,0) 66%,rgba(9,17,13,.55) 100%);
}
.poster .plate{position:relative;width:100%;padding:0 22px;text-align:center}
.title{
  margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;
  font-size:clamp(25px,7.3vw,38px);line-height:1;
  letter-spacing:.28em;text-indent:.28em;text-transform:uppercase;
  color:#F2F7EF;text-shadow:0 2px 24px rgba(0,0,0,.55);
}
.rule{height:1px;width:46%;margin:20px auto 22px;background:linear-gradient(90deg,transparent,rgba(242,247,239,.5),transparent)}
.count .num{
  display:block;font-family:Georgia,"Times New Roman",serif;font-weight:400;
  font-size:clamp(78px,25vw,116px);line-height:.88;letter-spacing:-.035em;
  color:#F6FAF3;text-shadow:0 4px 40px rgba(0,0,0,.55);
}
.count .cap{
  display:block;margin-top:16px;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(232,241,229,.78);font-weight:600;text-shadow:0 2px 16px rgba(0,0,0,.6);
}
.count.now .num{color:var(--lime)}

/* секции */
.section{margin-top:12px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:19px 20px}
.head .h{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-2);font-weight:600}
.head .c{display:flex;align-items:center;gap:11px;font-size:12px;color:var(--text-3);white-space:nowrap}
.bpanel{padding:2px 20px 20px}
.sect{margin-top:12px;overflow:hidden}
.sect summary{list-style:none;cursor:pointer}
.sect summary::-webkit-details-marker{display:none}
.sect .chev{width:8px;height:8px;margin-top:-3px;border-right:1.5px solid var(--text-3);border-bottom:1.5px solid var(--text-3);transform:rotate(45deg);transition:transform .25s ease}
.sect[open] .chev{transform:rotate(-135deg);margin-top:2px}
.sect[open] summary .h{color:var(--sage)}
.sect .body{padding:2px 20px 20px;max-height:66vh;overflow-y:auto;overscroll-behavior:contain}
.done-n{color:var(--sage);font-weight:600}
.grp{
  margin:20px 0 10px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--text-3);font-weight:600;
}
.row:first-child + .grp,.grp:first-child{margin-top:6px}

/* дом */
.home .ha{margin:0;font-size:16px;line-height:1.45}
.home .hb{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--text-2)}
.home .th{color:var(--text-3)}
.hrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.mini{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 14px;border:1px solid var(--edge);border-radius:99px;background:rgba(255,255,255,.04);
  font:inherit;font-size:13px;color:var(--text-2);cursor:pointer;text-decoration:none;
}
.mini.wide{display:flex;width:100%;margin-top:10px;color:var(--sage)}
.hintline{margin:-8px 0 18px;font-size:12px;color:var(--text-3);line-height:1.5}

/* бюджет */
.amount{font-size:46px;line-height:1;margin:0}
.amount .cur{font-size:24px;color:var(--text-2);margin-right:5px}
.amount-sub{margin:10px 0 0;font-size:13.5px;color:var(--text-2)}
.bar{position:relative;height:6px;border-radius:99px;background:rgba(255,255,255,.09);margin-top:20px;overflow:hidden}
.bar i{
  position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--sage-deep),var(--sage) 60%,var(--lime));
  transition:width .5s cubic-bezier(.4,0,.2,1);animation:breathe 8s ease-in-out infinite;
}
.bar.over i{background:linear-gradient(90deg,#8E6F3A,var(--gold))}
@keyframes breathe{0%,100%{opacity:.78}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}}
.badge{display:inline-block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(201,169,97,.35);border-radius:99px;padding:3px 9px}
.plan{margin-top:20px;border-top:1px solid var(--edge-2);padding-top:6px}
.plan summary{list-style:none;cursor:pointer;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:10px 0}
.plan summary::-webkit-details-marker{display:none}
.plan summary::after{content:" +";color:var(--sage)}
.plan[open] summary::after{content:" –"}
.pl{margin-top:13px}
.pl-top{display:flex;justify-content:space-between;font-size:13.5px;color:var(--text-2);margin-bottom:6px;gap:12px}
.pl-num{color:var(--text-3);white-space:nowrap}
.pl-bar{height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.pl-bar i{display:block;height:100%;border-radius:99px;background:var(--sage-deep)}
.pl-bar.over i{background:var(--gold)}

/* строки */
.row{display:flex;gap:13px;padding:16px 0;border-top:1px solid var(--edge-2);align-items:flex-start}
.row:first-child{border-top:0;padding-top:0}
.grp + .row{border-top:0;padding-top:0}
.row .main{flex:1 1 auto;min-width:0}
.row .t{margin:0;font-size:15px;line-height:1.35}
.row .s{margin:5px 0 0;font-size:12.5px;color:var(--text-2)}
.row .n{margin:6px 0 0;font-size:12.5px;color:var(--text-3);font-style:italic}
.row .side{flex:0 0 auto;text-align:right;font-size:13.5px;color:var(--text-2);white-space:nowrap}
.row.done .t,.row.done .s,.row.done .n{opacity:.38;text-decoration:line-through}
.lk{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--sage-deep);text-decoration:none}
.expenses{margin-top:18px;border-top:1px solid var(--edge-2);padding-top:4px}
.tick{flex:0 0 auto;width:21px;height:21px;border-radius:50%;border:1.5px solid rgba(168,201,154,.45);margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tick.on{background:var(--sage);border-color:var(--sage)}
.tick svg{display:none}
.tick.on svg{display:block}
.del{flex:0 0 auto;border:0;background:none;color:var(--text-3);font-size:21px;line-height:1;padding:0 2px;cursor:pointer}
.empty{margin:16px 0 0;color:var(--text-3);font-size:13.5px;line-height:1.5}

/* нижняя кнопка */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px var(--pad) calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(13,23,18,0),rgba(13,23,18,.92) 45%,var(--bg))}
.dock-inner{max-width:520px;margin:0 auto}
.primary{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;border:0;border-radius:99px;
  background:linear-gradient(135deg,var(--sage),var(--sage-deep));color:#0D1712;font:inherit;font-size:16px;font-weight:600;
  cursor:pointer;box-shadow:0 10px 26px rgba(127,168,114,.24);
}
.primary:active{transform:translateY(1px)}

/* шторка */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(6,12,9,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:linear-gradient(180deg,#16241C,#101B15);
  border-top:1px solid var(--edge);border-radius:26px 26px 0 0;
  padding:10px var(--pad) calc(26px + env(safe-area-inset-bottom));
  transform:translateY(101%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto 20px}
.sheet h3{margin:0 0 20px;font-size:22px}
.sheet .inner{max-width:520px;margin:0 auto}
label.f{display:block;margin-bottom:18px}
label.f span{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:9px}
input.f{width:100%;padding:15px 16px;border:1px solid var(--edge);border-radius:14px;background:rgba(255,255,255,.05);font:inherit;font-size:17px;color:var(--text)}
input.f::placeholder{color:var(--text-3)}
input.f:focus{outline:none;border-color:var(--sage);background:rgba(255,255,255,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 15px;border:1px solid var(--edge);border-radius:99px;background:rgba(255,255,255,.04);font:inherit;font-size:14px;color:var(--text-2);cursor:pointer}
.chip.on{background:var(--sage);border-color:var(--sage);color:#0D1712}
.contact{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--edge-2);text-decoration:none;color:inherit}
.grp + .contact{border-top:0}
.contact .cl{display:flex;flex-direction:column;gap:3px;min-width:0}
.contact b{font-weight:400;font-size:15px}
.contact i{font-style:normal;font-size:12px;color:var(--text-3)}
.contact .cv{color:var(--sage);font-size:15px;white-space:nowrap}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.stub{padding:80px var(--pad);text-align:center;max-width:420px;margin:0 auto}
.stub h2{font-size:24px;margin:0 0 12px}
.stub p{color:var(--text-2);font-size:15px;margin:0 0 26px;line-height:1.55}
</style>
</head>

<div class="dock" id="dock" hidden>
  <div class="dock-inner"><button class="primary" id="addBtn">Добавить трату</button></div>
</div>

<div class="sheet" id="sheet"><div class="inner" id="sheetBody"></div></div>

      return '<p class="t">' + esc(x.title) + '</p>'
        + (x.where ? '<p class="s">' + esc(x.where) + '</p>' : '')
        + (x.note ? '<p class="n">' + esc(x.note) + '</p>' : '')
        + linksOf(x);
    });

    html += '</div>';

    document.getElementById("app").innerHTML = html;
    document.getElementById("dock").hidden = false;
    document.getElementById("addBtn").innerHTML = I.plus + " Добавить трату";
    bind();
  }

  /* раскрываемый раздел: пункты из файла + свои, с галочками */
  function fold(key, title, items, main, side){
    items = items || [];
    var own = added(key);
    var total = items.length + own.length;
    if (!total) return "";

    var h = '<details class="sect glass" data-fold="' + key + '"' + (mine.open[key] ? " open" : "") + '>'
      + '<summary><div class="head"><span class="h">' + esc(title) + '</span>'
      + '<span class="c">' + counter(key, items, own) + '<i class="chev"></i></span></div></summary>'
      + '<div class="body">';

    var group = null;
    items.forEach(function(x,i){
      if (x.group && x.group !== group){ group = x.group; h += '<p class="grp">' + esc(group) + '</p>'; }
      var k = key + i, on = !!mine.checked[k];
      h += '<div class="row' + (on ? " done" : "") + '">' + tick(k, on)
        + '<div class="main">' + main(x) + '</div>'
        + (side && side(x) ? '<div class="side">' + esc(side(x)) + '</div>' : '')
        + '</div>';
    });

    if (own.length){
      h += '<p class="grp">Добавлено вручную</p>';
      own.forEach(function(x){
        var k = key + ":" + x.id, on = !!mine.checked[k];
        h += '<div class="row' + (on ? " done" : "") + '">' + tick(k, on)
          + '<div class="main"><p class="t">' + esc(x.title) + '</p>'
          + (x.note ? '<p class="n">' + esc(x.note) + '</p>' : '') + '</div>'
          + '<button class="del" data-drop="' + key + '|' + esc(x.id) + '" aria-label="Удалить пункт">×</button>'
          + '</div>';
      });
    }

    h += '<button class="mini wide" data-new="' + key + '">' + I.plusS + ' Добавить пункт</button>';
    return h + '</div></details>';
  }

  function counter(key, items, own){
    var total = items.length + own.length, done = 0, i;
    for (i=0;i<items.length;i++) if (mine.checked[key+i]) done++;
    for (i=0;i<own.length;i++) if (mine.checked[key+":"+own[i].id]) done++;
    if (!done) return total + " " + plural(total,["пункт","пункта","пунктов"]);
    return '<b class="done-n">' + done + '</b> из ' + total + ' отмечено';
  }
  function tick(key,on){
    return '<span class="tick' + (on?" on":"") + '" data-tick="' + key + '" role="checkbox" tabindex="0" aria-checked="'
      + (on?"true":"false") + '">' + I.check + '</span>';
  }

  /* ---------------- события ---------------- */
  function bind(){
    document.getElementById("sosBtn").onclick = openContacts;
    document.getElementById("editAddr").onclick = openAddress;

    [].forEach.call(document.querySelectorAll("[data-tick]"), function(el){
      function toggle(){
        var k = el.getAttribute("data-tick");
        mine.checked[k] = !mine.checked[k];
        haptic(); save(); render();
      }
      el.onclick = toggle;
      el.onkeydown = function(ev){ if (ev.key===" "||ev.key==="Enter"){ ev.preventDefault(); toggle(); } };
    });

    [].forEach.call(document.querySelectorAll("[data-fold]"), function(el){
      el.ontoggle = function(){ mine.open[el.getAttribute("data-fold")] = el.open; save(); };
    });

    [].forEach.call(document.querySelectorAll("[data-del]"), function(el){
      el.onclick = function(){
        var id = el.getAttribute("data-del");
        mine.expenses = expenses().filter(function(e){ return e.id !== id; });
        save(); render();
      };
    });

    [].forEach.call(document.querySelectorAll("[data-drop]"), function(el){
      el.onclick = function(ev){
        ev.preventDefault(); ev.stopPropagation();
        var p = el.getAttribute("data-drop").split("|"), key = p[0], id = p[1];
        mine.add[key] = added(key).filter(function(x){ return x.id !== id; });
        delete mine.checked[key + ":" + id];
        save(); render();
      };
    });

    [].forEach.call(document.querySelectorAll(".lk"), function(el){
      el.onclick = function(ev){ ev.stopPropagation(); };
    });

    [].forEach.call(document.querySelectorAll("[data-new]"), function(el){
      el.onclick = function(ev){ ev.preventDefault(); openNew(el.getAttribute("data-new")); };
    });

    [].forEach.call(document.querySelectorAll("[data-copy]"), function(el){
      el.onclick = function(){
        var text = document.getElementById(el.getAttribute("data-copy")).textContent;
        copy(text, el);
      };
    });
  }

  function copy(text, btn){
    function done(){
      var old = btn.innerHTML;
      btn.innerHTML = "Скопировано";
      setTimeout(function(){ btn.innerHTML = old; }, 1600);
      haptic();
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallback(text, done); });
    } else fallback(text, done);
  }
  function fallback(text, done){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){}
    document.body.removeChild(ta);
  }

  /* ---------------- шторки ---------------- */
  var scrim = document.getElementById("scrim"),
      sheet = document.getElementById("sheet"),
      sbody = document.getElementById("sheetBody");

  function openSheet(html){ sbody.innerHTML = html; scrim.classList.add("on"); sheet.classList.add("on"); }
  function closeSheet(){ scrim.classList.remove("on"); sheet.classList.remove("on"); }
  scrim.onclick = closeSheet;

  var TITLES = { r:"пункт до вылета", p:"место", e:"экскурсию", c:"идею для съёмки" };

  function openNew(key){
    openSheet('<div class="grip"></div><h3 class="display">Добавить ' + esc(TITLES[key] || "пункт") + '</h3>'
      + '<label class="f"><span>Название</span><input class="f" id="nTitle" type="text" autocomplete="off"></label>'
      + '<label class="f"><span>Заметка, если нужна</span><input class="f" id="nNote" type="text" autocomplete="off"></label>'
      + '<button class="primary" id="nSave">Сохранить</button>');
    document.getElementById("nTitle").focus();
    document.getElementById("nSave").onclick = function(){
      var title = document.getElementById("nTitle").value.trim();
      if (!title){ document.getElementById("nTitle").focus(); return; }
      if (!mine.add[key]) mine.add[key] = [];
      mine.add[key].push({ id: uid(), title: title, note: document.getElementById("nNote").value.trim() });
      mine.open[key] = true;
      haptic(); save(); closeSheet(); render();
    };
  }

  document.getElementById("addBtn").onclick = function(){
    var chips = CATEGORIES.map(function(c,i){
      return '<button type="button" class="chip' + (i===0?" on":"") + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    }).join("");
    openSheet('<div class="grip"></div><h3 class="display">Новая трата</h3>'
      + '<label class="f"><span>Сумма, ' + data.budget.currency + '</span>'
      + '<input class="f" id="fSum" type="number" inputmode="decimal" placeholder="0" autocomplete="off"></label>'
      + '<label class="f"><span>Категория</span><div class="chips" id="fCats">' + chips + '</div></label>'
      + '<label class="f"><span>На что</span>'
      + '<input class="f" id="fNote" type="text" placeholder="Например, ужин на пляже" autocomplete="off"></label>'
      + '<label class="f"><span>Когда</span>'
      + '<input class="f" id="fDate" type="date" value="' + new Date().toISOString().slice(0,10) + '"></label>'
      + '<button class="primary" id="fSave">Сохранить</button>');

    var cat = CATEGORIES[0];
    [].forEach.call(document.querySelectorAll("#fCats .chip"), function(el){
      el.onclick = function(){
        [].forEach.call(document.querySelectorAll("#fCats .chip"), function(o){ o.classList.remove("on"); });
        el.classList.add("on"); cat = el.getAttribute("data-cat");
      };
    });
    document.getElementById("fSum").focus();
    document.getElementById("fSave").onclick = function(){
      var sum = parseFloat(document.getElementById("fSum").value);
      if (!sum || sum <= 0){ document.getElementById("fSum").focus(); return; }
      if (mine.expenses === null) mine.expenses = [];
      mine.expenses.push({
        id: "x" + Date.now(), sum: sum, category: cat,
        note: document.getElementById("fNote").value.trim(),
        date: document.getElementById("fDate").value || new Date().toISOString().slice(0,10)
      });
      haptic(); save(); closeSheet(); render();
    };
  };

  function openAddress(){
    openSheet('<div class="grip"></div><h3 class="display">Где мы живём</h3>'
      + '<label class="f"><span>Своя строка: этаж, номер, код</span>'
      + '<input class="f" id="fAddr" type="text" value="' + esc(mine.address) + '" placeholder="' + esc(data.home.ru) + '"></label>'
      + '<p class="hintline">Заменит верхнюю строку. Хранится только у тебя, в файле приложения этого нет.</p>'
      + '<button class="primary" id="fSaveAddr">Сохранить</button>');
    document.getElementById("fAddr").focus();
    document.getElementById("fSaveAddr").onclick = function(){
      mine.address = document.getElementById("fAddr").value.trim();
      save(); closeSheet(); render();
    };
  }

  function openContacts(){
    var group = null, rows = "";
    data.contacts.forEach(function(c){
      if (c.group && c.group !== group){ group = c.group; rows += '<p class="grp">' + esc(group) + '</p>'; }
      rows += '<a class="contact" href="tel:' + esc(String(c.value).replace(/[^\d+]/g,"")) + '">'
        + '<span class="cl"><b>' + esc(c.label) + '</b>'
        + (c.note ? '<i>' + esc(c.note) + '</i>' : '') + '</span>'
        + '<span class="cv">' + esc(c.value) + '</span></a>';
    });
    openSheet('<div class="grip"></div><h3 class="display">Экстренные контакты</h3>' + rows);
  }

  function stub(){
    document.getElementById("app").innerHTML =
      '<div class="stub"><h2 class="display">Данные не загрузились</h2>'
      + '<p>Файл data.json не открылся, встроенной копии тоже нет.</p>'
      + '<button class="primary" id="reload" style="max-width:240px;margin:0 auto">Обновить</button></div>';
    document.getElementById("dock").hidden = true;
    document.getElementById("reload").onclick = function(){ location.reload(); };
  }

  /* отсчёт живой: обновляем при возврате и при смене суток */
  var shownDay = new Date().toDateString();
  function refreshIfNewDay(){
    var d = new Date().toDateString();
    if (d !== shownDay && data) { shownDay = d; render(); }
  }
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) refreshIfNewDay(); });
  window.addEventListener("focus", refreshIfNewDay);
  setInterval(refreshIfNewDay, 60000);

  load(function(saved){
    if (saved){
      mine.address  = saved.address || "";
      mine.expenses = saved.expenses !== undefined ? saved.expenses : null;
      mine.checked  = saved.checked || {};
      mine.open     = saved.open || { r:true };
      mine.add      = saved.add || {};
    }
    fetch("data.json?v=" + Date.now(), { cache:"no-store" })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(json){ data = json; render(); })
      .catch(function(){
        if (typeof FALLBACK !== "undefined" && FALLBACK) { data = FALLBACK; offline = true; render(); }
        else stub();
      });
  });

})();

</script>
</body>
</html>
